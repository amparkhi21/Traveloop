{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow p-4">

            <!-- Heading -->

            <h2 class="text-center mb-4">

                Create Your Account

            </h2>

            <!-- Signup Form -->

            <form method="POST">

                <!-- Name -->

                <div class="mb-3">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label">

                        Email Address

                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <!-- Password -->

                <div class="mb-3">

                    <label class="form-label">

                        Password

                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Create a password"
                        required
                    >
                    
                </div>
                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >

                        Create Account

                    </button>

                </div>

            </form>

            <p class="text-center mt-4">

                Already have an account?

                <a href="/login">

                    Login Here

                </a>

            </p>

        </div>
    </div>
</div>
{% endblock %}
